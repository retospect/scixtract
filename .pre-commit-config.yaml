repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88, --target-version=py310]

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy type checking (strict)
        entry: bash -c 'echo "🔍 Type checking source code..." && python -m mypy src/ --strict --ignore-missing-imports'
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy-tests
        name: mypy type checking tests (lenient)
        entry: bash -c 'echo "🔍 Type checking tests (lenient)..." && python -m mypy tests/ --ignore-missing-imports --disable-error-code=no-untyped-def --disable-error-code=no-any-return || echo "⚠️ Test type checking completed with warnings"'
        language: system
        pass_filenames: false
        always_run: true

      - id: flake8-strict
        name: flake8 linting (strict)
        entry: bash -c 'echo "🔍 Running flake8 with strict settings..." && flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503'
        language: system
        pass_filenames: false
        always_run: true

      - id: flake8-complexity
        name: flake8 complexity check
        entry: bash -c 'echo "🔍 Running additional code quality checks..." && flake8 src/ tests/ --select=C901 --max-complexity=16'
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-fast
        name: fast unit tests
        entry: bash -c 'PYTHONPATH=src python -m pytest tests/ -x --tb=short -q --disable-warnings -k "not slow" --maxfail=3'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        additional_dependencies: [pbr]
        args: [-r, src/, --configfile, pyproject.toml]
        exclude: tests/
        pass_filenames: false
        always_run: true
